<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <title>ut-comaps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc46d"/>
      <stop offset="1" stop-color="#3d8f46"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d9bff"/>
      <stop offset="1" stop-color="#1e6fe0"/>
    </linearGradient>
    <clipPath id="map">
      <path d="M44 70 L100 50 L156 70 L212 50 L212 190 L156 210 L100 190 L44 210 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background (full-bleed; Lomiri applies its own shape mask) -->
  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- folded map, dark like the app in dark mode -->
  <g filter="url(#shadow)">
    <g clip-path="url(#map)">
      <path d="M44 70 L100 50 L100 190 L44 210 Z" fill="#2c2c2e"/>
      <path d="M100 50 L156 70 L156 210 L100 190 Z" fill="#242426"/>
      <path d="M156 70 L212 50 L212 190 L156 210 Z" fill="#2c2c2e"/>
      <!-- forest -->
      <path d="M44 150 C70 142 88 158 100 176 L100 214 L44 214 Z" fill="#35553a"/>
      <!-- river -->
      <path d="M34 110 C72 98 94 128 128 122 C162 116 184 144 222 132"
            fill="none" stroke="#3b6f8f" stroke-width="10" stroke-linecap="round"/>
      <!-- roads -->
      <path d="M60 222 C84 166 112 150 150 142 C180 136 198 108 206 40"
            fill="none" stroke="#e39a3b" stroke-width="8" stroke-linecap="round"/>
      <path d="M34 182 L222 96" fill="none" stroke="#8e8e93" stroke-width="5" stroke-linecap="round"/>
      <!-- fold shading -->
      <path d="M100 50 L108 53 L108 193 L100 190 Z" fill="#000" opacity="0.18"/>
      <path d="M156 70 L148 67 L148 207 L156 210 Z" fill="#000" opacity="0.22"/>
    </g>
  </g>

  <!-- my position: round button with navigation arrow, as in the app -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="134" r="46" fill="#1c1c1e"/>
    <path d="M181 103 L117 131 L147 138 L154 168 Z" fill="url(#arrow)"
          stroke="url(#arrow)" stroke-width="6" stroke-linejoin="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
